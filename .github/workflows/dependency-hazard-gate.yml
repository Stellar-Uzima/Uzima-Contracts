name: Dependency Health / Hazard Gate

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/dependency_health_check.sh"
      - "scripts/dependency_hazard_report.sh"
      - ".github/workflows/dependency-hazard-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/dependency_health_check.sh"
      - "scripts/dependency_hazard_report.sh"
      - ".github/workflows/dependency-hazard-gate.yml"

jobs:
  dependency-hazard-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dep-hazard-${{ hashFiles('**/Cargo.lock') }}

      - name: Build contracts (for the WASM size budget sub-check)
        run: make dist

      - name: Generate dependency health report
        run: ./scripts/dependency_health_check.sh reports/dependency_health.json

      # Fails the job on any hazard (workspace membership, version
      # misalignment, circular deps, oversized WASM) — see
      # scripts/dependency_hazard_report.sh's own HAZARD_COUNT/exit 1
      # handling. Nothing here swallows it with || true.
      - name: Run dependency hazard gate
        run: ./scripts/dependency_hazard_report.sh

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            reports/dependency_health.json
            schemas/dependency-hazard-report.json
          if-no-files-found: ignore
