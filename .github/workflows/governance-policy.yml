name: Governance Policy Checks

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/CODEOWNERS"
      - ".github/review-routing.json"
      - "scripts/check_codeowners_coverage.py"
      - ".github/workflows/governance-policy.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/CODEOWNERS"
      - ".github/review-routing.json"
      - "scripts/check_codeowners_coverage.py"
      - ".github/workflows/governance-policy.yml"

permissions:
  contents: read

jobs:
  contract-review-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check contract ownership and routing
        run: python3 scripts/check_codeowners_coverage.py
