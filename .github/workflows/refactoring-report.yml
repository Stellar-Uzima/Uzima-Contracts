name: Refactoring Suggestions

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - ".github/workflows/refactoring-report.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  refactoring-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy && rustup default 1.92.0

      # Advisory only: see docs/REFACTORING_SUGGESTIONS.md.
      - name: Refactoring suggestions
        continue-on-error: true
        run: |
          mkdir -p reports
          cargo clippy --all -- \
            -W clippy::too_many_lines \
            -W clippy::cognitive_complexity \
            -W dead_code \
            2>&1 | tee reports/refactoring.txt

      - name: Upload refactoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactoring-report
          path: reports/refactoring.txt
          if-no-files-found: warn

      # Idempotent: updates the existing comment (found by marker) instead of
      # posting a new one on every push. Fork PRs get a read-only token, so
      # this step must not fail the job.
      - name: Comment refactoring suggestions
        if: always() && hashFiles('reports/refactoring.txt') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- refactoring-suggestions -->';
            const report = fs.readFileSync('reports/refactoring.txt', 'utf8');
            const lines = report.split('\n').filter(l => l.startsWith('warning')).slice(0, 20);
            const body = lines.length > 0
              ? `${marker}\n### Refactoring Suggestions\n\`\`\`\n${lines.join('\n')}\n\`\`\`\nFull report: \`refactoring-report\` artifact.`
              : `${marker}\n### Refactoring Suggestions\nNo suggestions.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
