name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --exclude-paths=.trufflehog-excludes.txt --results=verified,unknown

      - name: Assert deploy scripts contain no embedded secret literals
        run: bash tests/secret_scan_fixture_test.sh
