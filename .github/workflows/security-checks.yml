name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-telemetry-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Informational for now — see docs/audits/SECURITY_TELEMETRY_CONFORMANCE.md
      # for why this doesn't fail the build yet.
      - name: Check security telemetry conformance
        run: ./scripts/check_security_telemetry_conformance.sh

  artifact-signing-key-rotation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Informational — see docs/audits/ARTIFACT_SIGNING_KEY_ROTATION.md.
      # Reproduces sign -> verify -> rotate -> verify against a throwaway
      # fixture artifact; doesn't require building any contracts.
      - name: Test key rotation invalidates old artifact verification
        run: ./scripts/test_key_rotation_invalidation.sh
