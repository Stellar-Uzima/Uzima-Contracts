name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ed25519-malleability-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Informational for now — see
      # docs/audits/ED25519_SIGNATURE_MALLEABILITY_CONFORMANCE.md for why
      # this doesn't fail the build yet.
      - name: Check Ed25519 signature-malleability conformance
        run: ./scripts/check_ed25519_malleability_conformance.sh
