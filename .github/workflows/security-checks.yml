name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  admin-recovery-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Informational for now — see docs/audits/ADMIN_RECOVERY_HARDENING.md
      # for why this doesn't fail the build yet.
      - name: Check admin/recovery negative-test coverage
        run: ./scripts/check_admin_recovery_test_coverage.sh

  crypto-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Informational for now — see
      # docs/audits/CRYPTOGRAPHIC_SECURITY_MODEL_CONFORMANCE.md for why
      # this doesn't fail the build yet.
      - name: Check cryptographic security model conformance
        run: ./scripts/check_crypto_conformance.sh
