name: Storage Budget Measurement

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/measure_storage.sh"
      - "docs/CONTRACT_RESOURCE_LIMITS.md"
      - ".github/workflows/storage-budget-measurement.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/measure_storage.sh"
      - "docs/CONTRACT_RESOURCE_LIMITS.md"
      - ".github/workflows/storage-budget-measurement.yml"

jobs:
  measure-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-storage-measure-${{ hashFiles('**/Cargo.lock') }}

      - name: Build contracts
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      # Fails the job when any contract exceeds the size/entry/CPU
      # thresholds in docs/CONTRACT_RESOURCE_LIMITS.md — see
      # measure_storage.sh's enforce_thresholds(). Nothing here swallows
      # that with || true.
      - name: Measure storage budgets
        run: ./scripts/measure_storage.sh

      - name: Upload storage reports (including Pareto top-10)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-measurement-reports
          path: |
            reports/storage_measurement_report.txt
            reports/storage_pareto_top10.txt
            reports/storage_pr_comment.txt
            reports/storage_summary.json
          if-no-files-found: ignore
