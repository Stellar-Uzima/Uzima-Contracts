name: Issue Triage SLA

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  issues: read

jobs:
  triage-sla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check open issue response targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --state open --limit 1000 --json number,title,url,createdAt,labels | python3 scripts/check_triage_sla.py
