name: WASM Size Monitoring

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/wasm_size_monitor.sh"
      - "scripts/wasm_size_baselines.json"
      - ".github/workflows/wasm-size-monitoring.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/wasm_size_monitor.sh"
      - "scripts/wasm_size_baselines.json"
      - ".github/workflows/wasm-size-monitoring.yml"

jobs:
  wasm-size-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-size-${{ hashFiles('**/Cargo.lock') }}

      - name: Install jq and bc
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Build contracts
        run: cargo build --workspace --target wasm32-unknown-unknown --release

      # Fails the job (exit 1) on a >10% size regression against
      # scripts/wasm_size_baselines.json, or a new 60 KB breach — see
      # wasm_size_monitor.sh's --check-baseline mode, which is explicitly
      # documented as "used by CI". Nothing here swallows it with || true.
      - name: Check WASM size against baseline
        run: ./scripts/wasm_size_monitor.sh --check-baseline

      - name: Export size trend data
        if: always()
        run: ./scripts/wasm_size_monitor.sh --export-trends

      - name: Upload WASM size reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-reports
          path: |
            .wasm_size_trends.json
            .wasm_optimization_tips.json
          if-no-files-found: ignore
