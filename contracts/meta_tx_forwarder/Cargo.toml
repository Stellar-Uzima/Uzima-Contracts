[package]
name = "meta_tx_forwarder"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/soroban-project"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the workspace-wide Soroban SDK policy (=21.7.7, see root Cargo.toml
# `[workspace.dependencies]`). Declared as a literal version rather than
# `.workspace = true`: this crate remains in the root `exclude` list, so it is
# not a resolvable workspace member for inheritance purposes. It is still a
# path dependency of the `tests` integration crate. The version is kept in
# exact lockstep with the workspace pin so there is no conflicting SDK
# declaration.
soroban-sdk = { version = "=21.7.7" }
governance_commons = { path = "../../libs/governance_commons" }

[dev-dependencies]
soroban-sdk = { version = "=21.7.7", features = ["testutils"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[features]
default = []
testutils = ["soroban-sdk/testutils"]
