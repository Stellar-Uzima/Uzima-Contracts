[package]
name = "fuzz-property-registry"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate — intentionally excluded from the workspace wasm32 build.
# Run with: cd tests/fuzz/property_registry && cargo test
# Long-duration fuzzing (CI default): PROPTEST_CASES=5000 cargo test
[workspace]

[dev-dependencies]
property_registry = { path = "../../../contracts/property_registry", features = ["testutils"] }
soroban-sdk = { version = "=21.7.7", features = ["testutils"] }
proptest = "1.6.0"